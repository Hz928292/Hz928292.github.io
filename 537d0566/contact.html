<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - 联系我</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><a href="index.html">我的主页</a></div>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="about.html">关于我</a></li>
            <li><a href="skills.html">技能</a></li>
            <li><a href="experience.html">经历</a></li>
            <li><a href="projects.html">项目</a></li>
            <li><a href="contact.html" class="active">联系我</a></li>
        </ul>
    </nav>

    <main class="page-content">
        <h1>联系我</h1>

        <section class="section">
            <div class="contact-grid">
                <div class="contact-info">
                    <h2>联系方式</h2>
                    <p class="placeholder-text">[写一段简短的话，邀请访客与你联系。]</p>
                    <ul class="contact-list">
                        <li><strong>邮箱：</strong>[your.email@example.com]</li>
                        <li><strong>电话：</strong>[+86 000 0000 0000]</li>
                        <li><strong>所在地：</strong>[城市，国家]</li>
                    </ul>
                    <div class="social-links">
                        <a href="#" class="social-link">[GitHub]</a>
                        <a href="#" class="social-link">[LinkedIn]</a>
                        <a href="#" class="social-link">[微信]</a>
                    </div>
                </div>

                <div class="contact-form-wrapper">
                    <h2>发送消息</h2>
                    <form class="contact-form" onsubmit="event.preventDefault(); alert('这是一个示例表单。');">
                        <div class="form-group">
                            <label for="name">姓名</label>
                            <input type="text" id="name" placeholder="[你的姓名]">
                        </div>
                        <div class="form-group">
                            <label for="email">邮箱</label>
                            <input type="email" id="email" placeholder="[你的邮箱]">
                        </div>
                        <div class="form-group">
                            <label for="message">留言</label>
                            <textarea id="message" rows="5" placeholder="[你的留言内容]"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">发送</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 [你的名字] 保留所有权利。</p>
    </footer>
</body>
</html>
